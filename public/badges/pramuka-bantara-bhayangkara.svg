<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bantaraGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
    <linearGradient id="policeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Hexagonal Shield Background -->
  <polygon points="80,10 145,35 145,115 80,150 15,115 15,35" fill="url(#bantaraGreen)" stroke="url(#goldGrad)" stroke-width="3.5" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.5))"/>

  <!-- Left Tunas Kelapa (Bantara) -->
  <g transform="translate(42, 45) scale(0.65)" fill="url(#goldGrad)" stroke="#78350F" stroke-width="1.5">
    <path d="M40 10 Q20 30 35 60 Q25 70 30 90 Q40 95 45 80 Q50 95 60 90 Q65 70 55 60 Q70 30 50 10 Z"/>
    <circle cx="45" cy="85" r="8"/>
  </g>

  <!-- Right Tunas Kelapa (Bantara) -->
  <g transform="translate(85, 45) scale(0.65)" fill="url(#goldGrad)" stroke="#78350F" stroke-width="1.5">
    <path d="M40 10 Q20 30 35 60 Q25 70 30 90 Q40 95 45 80 Q50 95 60 90 Q65 70 55 60 Q70 30 50 10 Z"/>
    <circle cx="45" cy="85" r="8"/>
  </g>

  <!-- SAKA Bhayangkara Emblem Center Crest -->
  <circle cx="80" cy="50" r="14" fill="url(#policeBlue)" stroke="url(#goldGrad)" stroke-width="2"/>
  <!-- Police 3-Star Diamond Emblem -->
  <polygon points="80,38 83,46 91,46 85,51 87,59 80,54 73,59 75,51 69,46 77,46" fill="#FDE047"/>
  
  <!-- Banner BANTARA -->
  <path d="M30 118 L130 118 L120 134 L40 134 Z" fill="url(#goldGrad)" stroke="#78350F" stroke-width="1.5"/>
  <text x="80" y="129" font-family="Arial, sans-serif" font-weight="900" font-size="9" fill="#14532D" text-anchor="middle" letter-spacing="1">BANTARA &amp; SAKA</text>

  <!-- Small Laurel / Paddy Leaves -->
  <path d="M28 65 Q22 85 30 105" stroke="#FDE047" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M132 65 Q138 85 130 105" stroke="#FDE047" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
