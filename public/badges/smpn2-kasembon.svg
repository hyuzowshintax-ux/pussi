<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="smpCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E7490"/>
      <stop offset="50%" stop-color="#155E75"/>
      <stop offset="100%" stop-color="#164E63"/>
    </linearGradient>
    <linearGradient id="smpGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
  </defs>

  <!-- Circular Star Shield -->
  <circle cx="80" cy="80" r="70" fill="url(#smpCyan)" stroke="url(#smpGold)" stroke-width="4" filter="drop-shadow(0 6px 8px rgba(0,0,0,0.5))"/>
  <circle cx="80" cy="80" r="62" fill="none" stroke="#FEF08A" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Star of Excellence -->
  <polygon points="80,24 84,36 96,36 86,44 90,56 80,48 70,56 74,44 64,36 76,36" fill="#FEF08A"/>

  <!-- Open Book & Pen of Learning -->
  <g fill="#FFFFFF" stroke="#64748B" stroke-width="0.8" transform="translate(80, 80)">
    <path d="M0 6 Q-18 -4 -32 0 L-32 -22 Q-18 -26 0 -19 Z"/>
    <path d="M0 6 Q18 -4 32 0 L32 -22 Q18 -26 0 -19 Z"/>
    <line x1="0" y1="-19" x2="0" y2="6" stroke="#334155" stroke-width="1.5"/>
  </g>

  <!-- Crossed Quill / Pen -->
  <line x1="65" y1="92" x2="95" y2="68" stroke="url(#smpGold)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Banner SMPN 2 KASEMBON -->
  <path d="M22 120 Q80 112 138 120 L130 138 Q80 128 30 138 Z" fill="url(#smpGold)" stroke="#78350F" stroke-width="1.5"/>
  <text x="80" y="130" font-family="Arial, sans-serif" font-weight="900" font-size="7.5" fill="#164E63" text-anchor="middle" letter-spacing="0.5">SMPN 2 KASEMBON</text>
  <text x="80" y="104" font-family="Arial, sans-serif" font-weight="800" font-size="6.5" fill="#BAE6FD" text-anchor="middle">KAB. MALANG</text>
</svg>
