<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="paskibraGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#052E16"/>
    </linearGradient>
    <linearGradient id="goldLotus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>
    <linearGradient id="flagRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
  </defs>

  <!-- Circular Outer Crest -->
  <circle cx="80" cy="80" r="70" fill="url(#paskibraGreen)" stroke="url(#goldLotus)" stroke-width="4" filter="drop-shadow(0 6px 8px rgba(0,0,0,0.5))"/>
  <circle cx="80" cy="80" r="62" fill="none" stroke="#FEF08A" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Merah Putih Flag Ribbon Background -->
  <g transform="translate(80, 52) scale(0.85)">
    <!-- Flag Pole -->
    <line x1="-35" y1="-30" x2="-35" y2="40" stroke="#EAB308" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-35" cy="-30" r="4" fill="#FEF08A"/>
    <!-- Red & White Flag Wave -->
    <path d="M-35 -28 Q-10 -35 15 -25 Q40 -15 65 -25 L65 5 Q40 15 15 5 Q-10 -5 -35 2 Z" fill="url(#flagRed)"/>
    <path d="M-35 2 Q-10 -5 15 5 Q40 15 65 5 L65 35 Q40 45 15 35 Q-10 25 -35 32 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8"/>
  </g>

  <!-- Official Paskibraka Lotus Flower (Bunga Teratai) -->
  <g fill="#FFFFFF" stroke="url(#goldLotus)" stroke-width="1.2" transform="translate(80, 84)">
    <!-- Center Petal -->
    <path d="M0 -30 C-10 -15 -10 5 0 15 C10 5 10 -15 0 -30 Z"/>
    <!-- Left Inner Petal -->
    <path d="M-5 -25 C-20 -10 -18 5 -2 15 C-8 5 -12 -12 -5 -25 Z"/>
    <!-- Right Inner Petal -->
    <path d="M5 -25 C20 -10 18 5 2 15 C8 5 12 -12 5 -25 Z"/>
    <!-- Left Outer Petal -->
    <path d="M-10 -18 C-30 -5 -25 10 -4 16 C-14 8 -22 -5 -10 -18 Z"/>
    <!-- Right Outer Petal -->
    <path d="M10 -18 C30 -5 25 10 4 16 C14 8 22 -5 10 -18 Z"/>
    <!-- Calyx / Base -->
    <ellipse cx="0" cy="16" rx="14" ry="4" fill="url(#goldLotus)"/>
  </g>

  <!-- Banner PASKIBRA -->
  <path d="M25 122 Q80 114 135 122 L128 138 Q80 130 32 138 Z" fill="url(#goldLotus)" stroke="#713F12" stroke-width="1.5"/>
  <text x="80" y="131" font-family="Arial, sans-serif" font-weight="900" font-size="7.5" fill="#052E16" text-anchor="middle" letter-spacing="0.5">PASKIBRA KANDANGAN</text>
</svg>
