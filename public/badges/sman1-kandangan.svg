<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="smanNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="smanGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>
  </defs>

  <!-- Pentagon School Crest -->
  <polygon points="80,8 150,56 124,146 36,146 10,56" fill="url(#smanNavy)" stroke="url(#smanGold)" stroke-width="3.5" filter="drop-shadow(0 6px 8px rgba(0,0,0,0.5))"/>

  <!-- Open Book of Knowledge -->
  <g fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.8" transform="translate(80, 80)">
    <path d="M0 5 Q-20 -5 -35 0 L-35 -25 Q-20 -30 0 -22 Z"/>
    <path d="M0 5 Q20 -5 35 0 L35 -25 Q20 -30 0 -22 Z"/>
    <line x1="0" y1="-22" x2="0" y2="5" stroke="#475569" stroke-width="1.5"/>
  </g>

  <!-- Torch of Education -->
  <path d="M80 34 Q86 42 80 50 Q74 42 80 34 Z" fill="#F97316"/>
  <path d="M80 38 Q83 44 80 48 Q77 44 80 38 Z" fill="#FDE047"/>
  <polygon points="76,50 84,50 82,60 78,60" fill="url(#smanGold)"/>

  <!-- Gear of Technology / Science -->
  <circle cx="80" cy="80" r="8" fill="none" stroke="url(#smanGold)" stroke-width="2" stroke-dasharray="2,2"/>

  <!-- Banner SMAN 1 KANDANGAN -->
  <path d="M25 120 Q80 112 135 120 L128 138 Q80 130 32 138 Z" fill="url(#smanGold)" stroke="#78350F" stroke-width="1.5"/>
  <text x="80" y="130" font-family="Arial, sans-serif" font-weight="900" font-size="7.5" fill="#1E3A8A" text-anchor="middle" letter-spacing="0.5">SMAN 1 KANDANGAN</text>
  <text x="80" y="24" font-family="Arial, sans-serif" font-weight="800" font-size="6.5" fill="#FEF08A" text-anchor="middle">KEDIRI</text>
</svg>
