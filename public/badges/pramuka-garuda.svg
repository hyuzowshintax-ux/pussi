<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="pgGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="pgRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <filter id="pgShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Outer Pentagon Gold Frame -->
  <polygon points="80,8 150,58 124,144 36,144 10,58" fill="url(#pgGold)" filter="url(#pgShadow)" stroke="#78350F" stroke-width="2"/>
  
  <!-- Inner Pentagon Red Background (Penggalang) -->
  <polygon points="80,18 140,62 117,136 43,136 20,62" fill="url(#pgRed)" stroke="#FEF08A" stroke-width="2"/>
  
  <!-- Sun Rays Radiance -->
  <g stroke="#FEF08A" stroke-width="1.5" opacity="0.6">
    <line x1="80" y1="26" x2="80" y2="40"/>
    <line x1="126" y1="62" x2="114" y2="68"/>
    <line x1="108" y1="125" x2="98" y2="115"/>
    <line x1="52" y1="125" x2="62" y2="115"/>
    <line x1="34" y1="62" x2="46" y2="68"/>
  </g>
  
  <!-- Garuda Body & Wings -->
  <!-- Left Wing -->
  <path d="M80 62 Q50 48 35 68 Q45 80 58 84 Q48 90 42 102 Q60 98 72 90 Z" fill="url(#pgGold)" stroke="#78350F" stroke-width="1.2"/>
  <!-- Right Wing -->
  <path d="M80 62 Q110 48 125 68 Q115 80 102 84 Q112 90 118 102 Q100 98 88 90 Z" fill="url(#pgGold)" stroke="#78350F" stroke-width="1.2"/>
  
  <!-- Garuda Head -->
  <path d="M80 44 Q85 36 90 44 Q88 50 80 56 Q72 50 70 44 Q75 36 80 44 Z" fill="url(#pgGold)" stroke="#78350F" stroke-width="1.2"/>
  <!-- Crown / Crest -->
  <polygon points="80,32 84,38 80,42 76,38" fill="#FEF08A"/>
  
  <!-- Center Shield (Merah Putih & Tunas Kelapa) -->
  <path d="M72 65 Q80 60 88 65 L88 82 Q80 92 72 82 Z" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <path d="M72 65 Q80 60 88 65 L88 73 L72 73 Z" fill="#DC2626"/>
  
  <!-- Center Coconut Shoot (Tunas Kelapa) -->
  <path d="M80 68 Q83 72 80 78 Q77 72 80 68 Z" fill="url(#pgGold)"/>
  <circle cx="80" cy="74" r="1.5" fill="#78350F"/>
  
  <!-- Ribbon at Bottom (SETIA SIAP SEDIA) -->
  <path d="M38 122 Q80 116 122 122 L128 134 Q80 128 32 134 Z" fill="url(#pgGold)" stroke="#78350F" stroke-width="1"/>
  <text x="80" y="129" font-family="Arial, sans-serif" font-weight="900" font-size="7.5" fill="#78350F" text-anchor="middle" letter-spacing="0.5">PRAMUKA GARUDA</text>
  
  <!-- Stars -->
  <polygon points="80,46 82,50 86,50 83,53 84,57 80,54 76,57 77,53 74,50 78,50" fill="#FFF"/>
</svg>
